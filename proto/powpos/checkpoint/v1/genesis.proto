syntax = "proto3";
package powpos.checkpoint.v1;

import "amino/amino.proto";
import "gogoproto/gogo.proto";
import "powpos/checkpoint/v1/params.proto";
import "powpos/checkpoint/v1/checkpoint.proto";

option go_package = "powpos/x/checkpoint/types";

// GenesisState defines the checkpoint module's genesis state.
message GenesisState {
  // params defines all the parameters of the module.
  Params params = 1 [
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];

  // checkpoints stores all historical checkpoints.
  repeated Checkpoint checkpoints = 2 [(gogoproto.nullable) = false];
}
