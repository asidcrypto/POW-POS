syntax = "proto3";
package powpos.powpos.v1;

import "amino/amino.proto";
import "gogoproto/gogo.proto";

option go_package = "powpos/x/powpos/types";

// Params defines the parameters for the module.
message Params {
  option (amino.name) = "powpos/x/powpos/Params";
  option (gogoproto.equal) = true;
  
}